# Training-SYS Secrets 模板
# 复制此文件为 secrets.toml 并填入真实值
# 注意：secrets.toml 已在 .gitignore 中，不会被提交到 GitHub

# 管理员登录密码（重要：改成你自己的强密码）
admin_password = "你的管理员密码"

# 密码重置默认值（管理员重置用户密码时使用）
default_reset_password = "你的重置密码"

# Gemini AI 配置
[gemini]
api_key = "你的Gemini API Key"
model_name = "gemini-2.5-flash"
use_ai_scoring = true
